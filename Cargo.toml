[package]
name = "disk-cleaner"
version = "0.1.0"
edition = "2024"
publish = false
build = "rust/build.rs"

[[bin]]
name = "DiskCleaner"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
csv = "1.3"
fontdue = "0.9"
chrono = "0.4"
notify = "8.2"
clap = { version = "4.5", features = ["derive"] }
gpui = { version = "=0.2.2", default-features = false }
gpui-component = "=0.5.1"
windows = { version = "0.61", features = ["Win32_Graphics_Imaging", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
tempfile = "3"
url = "2"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Networking_WinHttp", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
